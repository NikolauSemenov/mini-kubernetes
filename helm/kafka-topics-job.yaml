apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: kafka
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-client
          image: confluentinc/cp-kafka:7.0.1
          command:
            - bash
            - -c
            - |
              kafka-topics \
                --bootstrap-server kafka-service.kafka.svc.cluster.local:9092 \
                --create \
                --topic user_for_register_events \
                --partitions 1 \
                --replication-factor 1

                kafka-topics \
                  --bootstrap-server kafka-service.kafka.svc.cluster.local:9092 \
                  --create \
                  --if-not-exists \
                  --topic verify_email_events \
                  --partitions 1 \
                  --replication-factor 1
